# e2e fixture (BBP-171): a small, realistic crew.yaml — the round-trip test
# proves this comment survives an edit made through the canvas edit mode.
version: "1"
name: trio
summary: A lead and two devs, for the canvas edit-mode round trip.
groups:
  - id: orch
    members:
      # The lead plans; it never writes code itself.
      - id: lead
        lead: true
        role: Plans the work and assigns it.
        provider: claude-code
        model: claude-opus-5-5
  - id: dev
    members:
      - id: impl
        role: Implements what the lead assigns.
        provider: claude-code
        model: claude-sonnet-5-5
links:
  - from: orch-lead
    to: dev-impl
    kind: assigns_to
